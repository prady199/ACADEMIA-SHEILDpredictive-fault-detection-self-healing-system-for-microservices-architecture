<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academia Shield</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%231F5FBF' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%231F5FBF' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%231F5FBF'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<header class="top">
  <a class="brand" href="#/live" aria-label="Academia Shield home">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="16" r="3.5" fill="currentColor"/></svg>
    <span>Academia Shield</span>
  </a>
  <nav aria-label="Sections">
    <a href="#/live" data-nav="live">Live map</a>
    <a href="#/forecast" data-nav="forecast">Forecast</a>
    <a href="#/incidents" data-nav="incidents">Incidents<span class="badge" id="navIncidents" hidden></span></a>
    <a href="#/analytics" data-nav="analytics">Analytics</a>
    <a href="#/model" data-nav="model">Model</a>
    <a href="#/lab" data-nav="lab">Failure lab</a>
    <a href="#/alerts" data-nav="alerts">Alerts<span class="badge" id="navAlerts" hidden></span></a>
  </nav>
  <div class="top-right">
    <label class="mode">
      <span>Protection</span>
      <select id="modeSelect" aria-label="Protection mode">
        <option value="autonomous">Predict and recover</option>
        <option value="reactive">Recover after failure</option>
        <option value="observe">No protection</option>
      </select>
    </label>
    <button class="ghost" id="themeBtn" type="button" aria-label="Switch colour theme" title="Switch colour theme">
      <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 1 0 0 16V2z"/><circle cx="10" cy="10" r="7.3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
    <button class="primary" id="askBtn" type="button">Ask Academia Shield</button>
  </div>
</header>

<div class="conn" id="conn" hidden>The live connection dropped. Reconnecting. If this continues, check that <code>python run.py</code> is still running.</div>

<main id="view" tabindex="-1"></main>

<aside class="assistant" id="assistant" aria-label="Academia Shield assistant" hidden>
  <div class="as-head">
    <h2>Ask Academia Shield</h2>
    <button class="ghost" id="askClose" type="button" aria-label="Close assistant">Close</button>
  </div>
  <div class="as-log" id="asLog" aria-live="polite"></div>
  <div class="as-chips" id="asChips"></div>
  <form class="as-form" id="asForm">
    <input id="asInput" type="text" autocomplete="off" maxlength="500" placeholder="Why is payment failing?" aria-label="Your question">
    <button class="primary" type="submit">Ask</button>
  </form>
</aside>

<aside class="drawer" id="drawer" aria-label="Service details" hidden></aside>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="tip" id="tip" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
